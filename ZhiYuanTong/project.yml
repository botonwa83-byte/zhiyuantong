name: ZhiYuanTong
options:
  bundleIdPrefix: com.zhiyuantong
  deploymentTarget:
    iOS: '17.0'
    macOS: '14.0'
targets:
  ZhiYuanTong:
    type: application
    platform: iOS
    sources:
      - path: ZhiYuanTong
        excludes:
          - Resources/**
          - Info.plist
          - Info-macOS.plist
      - path: ZhiYuanTong/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhiyuantong.app
        PRODUCT_NAME: 志愿通
        TARGETED_DEVICE_FAMILY: '1,2'
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: '5.9'
        ENABLE_PREVIEWS: YES
        SUPPORTED_PLATFORMS: iphoneos iphonesimulator
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSFaceIDUsageDescription: 用于验证你的身份后查看分数与志愿表
    info:
      path: ZhiYuanTong/Info.plist
      properties:
        CFBundleDisplayName: 志愿通
        NSFaceIDUsageDescription: 用于验证你的身份后查看分数与志愿表
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: ''
  ZhiYuanTongMac:
    type: application
    platform: macOS
    sources:
      - path: ZhiYuanTong
        excludes:
          - Resources/**
          - Info.plist
          - Info-macOS.plist
      - path: ZhiYuanTong/Resources
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhiyuantong.app
        PRODUCT_NAME: 志愿通
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: '5.9'
        INFOPLIST_KEY_NSFaceIDUsageDescription: 用于验证你的身份后查看分数与志愿表
        ASSETCATALOG_COMPILER_APPICON_NAME: ''
    info:
      path: ZhiYuanTong/Info-macOS.plist
      properties:
        CFBundleDisplayName: 志愿通
        NSFaceIDUsageDescription: 用于验证你的身份后查看分数与志愿表
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.education
        LSMinimumSystemVersion: '14.0'

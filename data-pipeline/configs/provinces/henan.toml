name = "河南"
mode = "3+1+2"

[[sources]]
kind = "rank_table"
url_template = "https://hf-mirror.com/datasets/choucsan/Gaokao-Compass-11M/resolve/main/data/{year}/henan/score-range.csv"
parser = "hf_csv"

[sources.options]
dataset = "score-range"
column_map = { score = "score", cumulative_count = "rank", segment_count = "cum_count", category = "track" }
track_filter = ["物理类", "历史类"]

# 数据集只有物理类一分一段，历史类回省考试院官方 PDF（人工下载，见 docs/NEXT_STEPS.md）
# PDF 直链含随机 hash，无法用 {year} 模板推导，逐年登记到 url_overrides
[[sources]]
kind = "rank_table"
url_template = "https://www.haeea.cn/a/202506/43550_7465740d.shtml"
url_overrides = { 2025 = "https://www.haeea.cn/attach/file/20250625/20250625063714_3099_2be84248.pdf" }
parser = "prov_pdf"

[sources.options]
dataset = "his"
track = "his"
columns = ["score", "cum_count", "rank"]

[[sources]]
kind = "admission"
url_template = "https://hf-mirror.com/datasets/choucsan/Gaokao-Compass-11M/resolve/main/data/{year}/henan/school-admission.csv"
parser = "hf_csv"

[sources.options]
dataset = "school-admission"
column_map = { university_name = "uni_name", university_code = "uni_code", min_score = "min_score", min_rank = "min_rank", category = "track", batch = "batch", major_group = "group", subject_req = "subject_req", admit_count = "plan", school_province = "uni_prov", school_nature = "nature", is_985 = "is_985", is_211 = "is_211" }
fallback_columns = { group = "subject_req" }
track_filter = ["物理类", "历史类"]

# 专业级录取线（专业组 / 专业 + 选科要求 + 计划数）：官方 PDF 无稳定直链，掌上高考等聚合站也不自动抓，
# 一律人工整理成 CSV 放 raw/henan/{year}/major_admission_major.csv（表头见 templates/major_admission_template.csv）
[[sources]]
kind = "major_admission"
url_template = "https://www.haeea.cn/"
disabled = true
note = "源取回的是反爬 HTML 页面（raw/henan/2025/major_admission_major.csv），需人工按 templates/major_admission_template.csv 录入后启用"
parser = "manual"

[sources.options]
dataset = "major"
